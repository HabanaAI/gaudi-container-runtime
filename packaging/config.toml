disable-require = false

## Device selectors only configure accelerators already granted in the original
## OCI device list and cgroup permissions. Keep this false on shared nodes.
## Set true only for trusted standalone users who may grant themselves any host
## Gaudi device through environment variables. This bypasses allocation checks.
allow-env-device-requests = false

## Legacy privilege option; this does not authorize device allocation.
#accept-habana-visible-devices-envvar-when-unprivileged = true
#accept-habana-visible-devices-as-volume-mounts = false

## Uncomment and set to false if you are running inside kubernetes
## environment with Habana device plugin. Defaults to true
#mount_accelerators = false

## Mount uverbs mounts the attached infiniband_verb device attached to
## the selected accelerator devices. Defaults to true.
#mount_uverbs = false

## [Optional section]
#[network-layer-routes]
## Override the default path on hode for the network configuration layer.
## default:/etc/habanalabs/gaudinet.json
# path = "/etc/habanalabs/gaudinet.json"

[habana-container-cli]
#root = "/run/habana/driver"
#path = "/usr/bin/habana-container-cli"
environment = []
log_file = "/var/log/habana-container-hook.log"

## Logging level. Supported values: "info", "debug"
#log_level = "debug"


[habana-container-runtime]

## Configure all authorized accelerators when no device selector is present.
## This never bypasses allocation checks unless allow-env-device-requests is true.
## In that standalone compatibility mode, this exposes all host Gaudi devices.
##
## Default: false
#visible_devices_all_as_default = true

# Uncomment to change the default log file path.
#log_file = "/var/log/habana-container-runtime.log"

## Logging level. Supported values: "info", "debug"
#log_level = "debug"

## By default, runc creates cgroups and sets cgroup limits on its own (this mode is known as fs cgroup driver).
## By setting to true runc switches to systemd cgroup driver.
## Read more here: https://github.com/opencontainers/runc/blob/main/docs/systemd.md
#systemd_cgroup = false

## Use prestart hook for configuration. Valid modes: oci, legacy or cdi
## Default: oci
# mode = "legacy"
